[general]
persistentmembers = no

; Static member: answers every call it is given.
[amilink-q]
strategy = ringall
timeout = 5
retry = 1
joinempty = yes
leavewhenempty = no
member => Local/agent@amilink-conf/n,0,Lab Agent,Local/agent@amilink-conf

; No static members: QueueAdd / QueuePause / QueueRemove are tried on this one.
[amilink-dyn]
strategy = ringall
joinempty = yes
