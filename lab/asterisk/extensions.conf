; Calls that make Asterisk produce as many kinds of manager events as a lab
; without phones can. Every one is reached with Originate Local/<exten>@amilink-conf.
[general]
static = yes
writeprotect = yes

[amilink-live]
exten => amilink,1,Answer()
 same => n,Wait(1)
 same => n,Hangup()

[amilink-conf]
; Answers and stays a short while: the far end of most calls below.
exten => agent,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()

exten => hold,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

; Queue: QueueCallerJoin, AgentCalled, AgentConnect, AgentComplete, QueueCallerLeave.
exten => queue,1,Answer()
 same => n,Queue(amilink-q,,,,10)
 same => n,Hangup()

; Nobody answers: QueueCallerAbandon.
exten => abandon,1,Answer()
 same => n,Queue(amilink-dyn,,,,2)
 same => n,Hangup()

; Dial and bridge: DialBegin, DialState, DialEnd, BridgeCreate/Enter/Leave/Destroy.
exten => dial,1,Answer()
 same => n,Dial(Local/agent@amilink-conf,10)
 same => n,Hangup()

; Busy and no answer: DialEnd with other statuses, hangup causes.
exten => busy,1,Busy(1)
exten => cause,1,Hangup(17)

; DTMF: DTMFBegin, DTMFEnd.
exten => dtmf,1,Answer()
 same => n,SendDTMF(1234#,100)
 same => n,Wait(1)
 same => n,Hangup()

; Variables and user events: VarSet (when enabled), UserEvent, NewCallerid, NewAccountCode.
exten => vars,1,Answer()
 same => n,Set(CALLERID(num)=9800000001)
 same => n,Set(CHANNEL(accountcode)=amilink)
 same => n,UserEvent(AmilinkTest,Kind: vars,Value: one two)
 same => n,Set(GLOBAL(AMILINK_GLOBAL)=yes)
 same => n,Wait(1)
 same => n,Hangup()

; Mixing monitor: MixMonitorStart, MixMonitorStop.
exten => record,1,Answer()
 same => n,MixMonitor(/tmp/amilink-${UNIQUEID}.wav)
 same => n,Wait(1)
 same => n,StopMixMonitor()
 same => n,Hangup()

; Music on hold: MusicOnHoldStart, MusicOnHoldStop (no files is fine: the events still fire).
exten => moh,1,Answer()
 same => n,MusicOnHold(default,1)
 same => n,Hangup()

; Conference: ConfbridgeStart, ConfbridgeJoin, ConfbridgeLeave, ConfbridgeEnd.
exten => conf,1,Answer()
 same => n,ConfBridge(amilink)
 same => n,Hangup()

; Parking: ParkedCall, ParkedCallTimeOut.
exten => park,1,Answer()
 same => n,Park(default,t(2))
 same => n,Hangup()

; Many events fast, in order: UserEvent AmilinkBurst with N: 0..4999.
exten => burst,1,Answer()
 same => n,Set(i=0)
 same => n,While($[${i} < 5000])
 same => n,UserEvent(AmilinkBurst,N: ${i})
 same => n,Set(i=$[${i} + 1])
 same => n,EndWhile()
 same => n,Hangup()

; A hint on a custom device: DeviceStateChange action -> ExtensionStatus event.
exten => lab-hint,hint,Custom:amilink

[parkedcalls]
exten => _X.,1,Hangup()
