; Lab only: the port is published on 127.0.0.1 and the secret is not a real one.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[amilink]
secret = lab-only-not-a-real-secret
read = all
write = all

; Same rights, but Asterisk waits up to 5 s for this client to read before it
; drops events (the default is 100 ms). Used to show the difference.
[amilink-patient]
secret = lab-only-not-a-real-secret
read = all
write = all
writetimeout = 5000
